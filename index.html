    <script>
      (function() {
        // Prevent Vite HMR WebSocket connection errors in Cloud Run sandboxed preview
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (protocols === 'vite-hmr') isViteHmr = true;
            if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isViteHmr = true;
            if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/') !== -1)) isViteHmr = true;

            if (isViteHmr) {
              var listeners = {};
              var dummyWs = {
                url: url,
                readyState: 1, // WebSocket.OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try {
                        if (dummyWs.onopen) dummyWs.onopen({ type: 'open', target: dummyWs });
                        fn({ type: 'open', target: dummyWs });
                      } catch(e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function(event) {
                  var cbs = listeners[event.type] || [];
                  cbs.forEach(function(cb) {
                    try { cb(event); } catch(e) {}
                  });
                  return true;
                },
                send: function() {},
                close: function() {
                  dummyWs.readyState = 3;
                }
              };
              return dummyWs;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Global console and error listener suppressors
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            var str = String((args[i] && (args[i].message || args[i])) || '');
            if (
              str.indexOf('WebSocket') !== -1 ||
              str.indexOf('@vite/client') !== -1 ||
              str.indexOf('Could not reach Cloud Firestore backend') !== -1 ||
              str.indexOf('client will operate in offline mode') !== -1
            ) {
              console.warn('[Network Notice]', str);
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          var str = String(msg);
          if (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('Could not reach Cloud Firestore backend') !== -1 ||
            str.indexOf('client will operate in offline mode') !== -1
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          var str = String(reason);
          if (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('Could not reach Cloud Firestore backend') !== -1 ||
            str.indexOf('client will operate in offline mode') !== -1
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
