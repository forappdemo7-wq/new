<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A20"/>
      <stop offset="100%" stop-color="#0E1015"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.08"/>

  <!-- Official Original Open Book Emblem -->
  <g transform="translate(106, 126) scale(2.88)">
    <!-- Left Open Page Frame (Pure Off-White) -->
